<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <title>The Jewels</title>
    <meta
      name="description"
      content="Read The Jewels — an original webcomic. Free, multilingual, and updated chapter by chapter."
    />
    <meta name="theme-color" content="#f4eee6" />
    <meta name="color-scheme" content="light dark" />

    <!-- Safari never rendered the 176 KB nine-image .ico: a PNG it will take.
         The .ico stays for older Windows browsers that only read that. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="canonical" href="https://www.tomojw.com/" />

    <!-- Open Graph / Twitter -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.tomojw.com/" />
    <meta property="og:site_name" content="The Jewels" />
    <meta property="og:title" content="The Jewels" />
    <meta
      property="og:description"
      content="An original webcomic by Tomo. Free, multilingual, and updated chapter by chapter."
    />
    <meta property="og:image" content="/images/HomeBackground.png" />
    <meta property="og:locale" content="en_GB" />
    <meta property="og:locale:alternate" content="ja_JP" />
    <meta property="og:locale:alternate" content="pl_PL" />
    <meta property="og:locale:alternate" content="es_ES" />
    <meta property="og:locale:alternate" content="fr_FR" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="The Jewels" />
    <meta name="twitter:description" content="An original webcomic by Tomo." />
    <meta name="twitter:image" content="/images/HomeBackground.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@400;600;700&family=Noto+Sans+JP:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <script src="/theme-init.js"></script>
  </head>

  <body>
    <a class="skip-link" href="#page-content" data-i18n="nav.skipToContent">Skip to content</a>

    <div id="bg-image" aria-hidden="true">
      <img src="/images/HomeBackground.png" alt="" decoding="async" />
    </div>
    <canvas id="particle-canvas" aria-hidden="true"></canvas>
    <div id="gradient-overlay" aria-hidden="true"></div>

    <header class="navbar">
      <div class="nav-left">
        <a
          class="icon-btn"
          href="#home"
          data-sound="ui"
          data-i18n-attr="title:nav.home aria-label:nav.home"
        >
          <img src="/images/home.svg" alt="" aria-hidden="true" />
        </a>
        <a
          class="icon-btn"
          href="#chapters"
          data-sound="ui"
          data-i18n-attr="title:nav.chapters aria-label:nav.chapters"
        >
          <img src="/images/chapters.svg" alt="" aria-hidden="true" />
        </a>
        <a
          class="icon-btn"
          href="#contact"
          data-sound="ui"
          data-i18n-attr="title:nav.contact aria-label:nav.contact"
        >
          <img src="/images/contact.svg" alt="" aria-hidden="true" />
        </a>
        <a
          class="icon-btn"
          href="#fanart"
          data-sound="ui"
          data-i18n-attr="title:nav.fanart aria-label:nav.fanart"
        >
          <img src="/images/fanart.svg" alt="" aria-hidden="true" />
        </a>
      </div>

      <div class="nav-title">
        <a href="#home" data-i18n="site.title">The Jewels</a>
      </div>

      <div class="nav-right">
        <div class="nav-right-actions" id="nav-right-actions">
          <a
            class="icon-btn"
            id="account-action"
            href="#signin"
            data-sound="ui"
            data-i18n-attr="title:auth.signIn aria-label:auth.signIn"
            hidden
          >
            <img src="/images/account.svg" alt="" aria-hidden="true" />
          </a>

          <div class="dropdown" id="language-dropdown">
            <button
              type="button"
              class="icon-btn"
              id="language-toggle"
              aria-haspopup="true"
              aria-expanded="false"
              aria-controls="language-menu"
              data-sound="click"
              data-i18n-attr="title:nav.language aria-label:nav.language"
            >
              <img src="/images/language.svg" alt="" aria-hidden="true" />
            </button>
            <ul class="dropdown-menu" id="language-menu" role="menu"></ul>
          </div>

          <button
            type="button"
            class="icon-btn"
            id="theme-toggle"
            data-sound="click"
            aria-pressed="false"
            data-i18n-attr="title:nav.theme aria-label:nav.theme"
          >
            <!-- One shape, not two images cross-fading. The orb is a single
                 circle; a second circle punched out of it by the mask slides
                 across to carve the crescent, and the rays retract into it.
                 Two stacked PNGs could only dissolve through each other, which
                 is what read as a smudge halfway through. -->
            <svg class="theme-mark" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <mask id="theme-mark-mask">
                <rect x="0" y="0" width="24" height="24" fill="#fff" />
                <circle class="theme-bite" cx="26" cy="8" r="7" fill="#000" />
              </mask>
              <circle class="theme-orb" cx="12" cy="12" r="5.5" mask="url(#theme-mark-mask)" />
              <g class="theme-rays" stroke-linecap="round">
                <line x1="12" y1="1.6" x2="12" y2="4" />
                <line x1="12" y1="20" x2="12" y2="22.4" />
                <line x1="1.6" y1="12" x2="4" y2="12" />
                <line x1="20" y1="12" x2="22.4" y2="12" />
                <line x1="4.6" y1="4.6" x2="6.3" y2="6.3" />
                <line x1="17.7" y1="17.7" x2="19.4" y2="19.4" />
                <line x1="4.6" y1="19.4" x2="6.3" y2="17.7" />
                <line x1="17.7" y1="6.3" x2="19.4" y2="4.6" />
              </g>
            </svg>
          </button>

          <button
            type="button"
            class="icon-btn"
            id="sound-toggle"
            aria-pressed="true"
            data-i18n-attr="title:nav.sound aria-label:nav.sound"
          >
            <span class="sound-icon" aria-hidden="true">
              <img src="/images/sound.svg" alt="" />
              <span class="sound-slash"></span>
            </span>
          </button>
        </div>
      </div>
    </header>

    <main id="page-content" tabindex="-1"></main>

    <footer class="site-footer">
      <div class="site-footer-inner">
        <small><span data-i18n="site.title">The Jewels</span> &copy; 2026 Tomo</small>
        <a href="#privacy" data-sound="ui" data-i18n="legal.privacy.title">Privacy</a>
        <a href="#terms" data-sound="ui" data-i18n="legal.terms.title">Terms</a>
        <a href="#contact" data-sound="ui" data-i18n="nav.contact">Contact</a>
      </div>
    </footer>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
