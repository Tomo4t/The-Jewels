<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <!-- Drawn twice: a dark halo underneath, the white beam on top. A cursor is an
       external image with no CSS context, so `currentColor` never resolves here
       and the old version rendered as nothing at all. -->
  <g fill="none" stroke-linecap="round">
    <path d="M12 4.4 V19.6 M8.6 4.4 H15.4 M8.6 19.6 H15.4"
          stroke="#16121f" stroke-width="4.2"/>
    <path d="M12 4.4 V19.6 M8.6 4.4 H15.4 M8.6 19.6 H15.4"
          stroke="#ffffff" stroke-width="1.8"/>
  </g>
</svg>
